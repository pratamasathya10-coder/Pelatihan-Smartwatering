<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Watering</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header>
            <div>
                <h1>🌱 Smart Watering</h1>
                <p>Sistem Penyiraman Tanaman</p>
            </div>

            <div class="connection">
                <span class="dot"></span>
                ESP32 Terhubung
            </div>
        </header>


        <!-- DASHBOARD -->
        <main>

            <!-- KELEMBAPAN TANAH -->
            <section class="card moisture-card">

                <h2>Kelembapan Tanah</h2>

                <div class="moisture-value">
                    <span id="moisture">68</span>%
                </div>

                <div class="progress">
                    <div id="progressBar"></div>
                </div>

                <p id="condition" class="condition good">
                    🟢 Tanah Cukup Lembap
                </p>

            </section>


            <!-- MODE -->
            <section class="card">

                <h2>Mode Sistem</h2>

                <div class="mode-container">

                    <button
                        id="autoButton"
                        class="mode-button active"
                        onclick="setMode('auto')">
                        🤖 Otomatis
                    </button>

                    <button
                        id="manualButton"
                        class="mode-button"
                        onclick="setMode('manual')">
                        👆 Manual
                    </button>

                </div>

                <p class="current-mode">
                    Mode saat ini:
                    <strong id="modeText">OTOMATIS</strong>
                </p>

            </section>


            <!-- POMPA -->
            <section class="card">

                <h2>Status Pompa</h2>

                <div id="pumpStatus" class="pump-status off">
                    🔴 POMPA MATI
                </div>

                <div class="pump-buttons">

                    <button
                        class="button on"
                        onclick="pumpControl('on')">
                        💧 Nyalakan
                    </button>

                    <button
                        class="button off"
                        onclick="pumpControl('off')">
                        ⛔ Matikan
                    </button>

                </div>

            </section>


            <!-- STATUS SISTEM -->
            <section class="card">

                <h2>Status Sistem</h2>

                <div class="status-row">
                    <span>ESP32</span>
                    <span class="status-online">
                        🟢 Terhubung
                    </span>
                </div>

                <div class="status-row">
                    <span>Sensor Tanah</span>
                    <span class="status-online">
                        🟢 Aktif
                    </span>
                </div>

                <div class="status-row">
                    <span>Pompa</span>
                    <span id="systemPumpStatus">
                        🔴 Mati
                    </span>
                </div>

            </section>

        </main>


        <footer>
            Smart Watering • ESP32 Web Monitoring
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
